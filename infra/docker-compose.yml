name: vision-codef

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vision_codef
      POSTGRES_PASSWORD: vision_codef
      POSTGRES_DB: vision_codef
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vision_codef -d vision_codef']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ['6333:6333', '6334:6334']
    volumes: ['qdrant-data:/qdrant/storage']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:6333/healthz >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.9.0
    command: --config /etc/livekit.yaml --dev
    ports: ['7880:7880', '7881:7881', '7882:7882/udp']
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7880/ >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
