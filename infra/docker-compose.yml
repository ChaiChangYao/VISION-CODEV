services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vision_codef
      POSTGRES_PASSWORD: vision_codef
      POSTGRES_DB: vision_codef
    ports: ['5432:5432']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U vision_codef -d vision_codef'],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
    volumes: ['vision-codef-postgres:/var/lib/postgresql/data']
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 5s, retries: 10 }
  qdrant:
    image: qdrant/qdrant:latest
    ports: ['6333:6333', '6334:6334']
    volumes: ['vision-codef-qdrant:/qdrant/storage']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: change-me, MINIO_ROOT_PASSWORD: change-me-secret }
    ports: ['9000:9000', '9001:9001']
    volumes: ['vision-codef-minio:/data']
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_started }
    entrypoint: ['/bin/sh', '-c']
    command:
      [
        'until mc alias set local http://minio:9000 change-me change-me-secret; do sleep 1; done; mc mb --ignore-existing local/vision-codef',
      ]
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: vision_codef
      POSTGRES_PWD: vision_codef
      POSTGRES_SEEDS: postgres
    depends_on: { postgres: { condition: service_healthy } }
    ports: ['7233:7233', '8233:8233']
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    depends_on: { redis: { condition: service_healthy } }
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    ports: ['7880:7880', '7881:7881', '7882:7882/udp']
  livekit-egress:
    image: livekit/egress:latest
    depends_on:
      redis: { condition: service_healthy }
      livekit: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    cap_add: [SYS_ADMIN]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: devkey
        api_secret: devsecret
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        s3:
          access_key: change-me
          secret: change-me-secret
          region: us-east-1
          bucket: vision-codef
          endpoint: http://minio:9000
    restart: on-failure

volumes:
  vision-codef-postgres:
  vision-codef-qdrant:
  vision-codef-minio:
