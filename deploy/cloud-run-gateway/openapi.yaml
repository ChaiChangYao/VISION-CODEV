swagger: '2.0'
info:
  title: Vision Codef Frame Analysis
  version: '1.0'
schemes: [https]
produces: [application/json]
consumes: [application/json]
x-google-backend:
  address: https://vision-codef-gateway-772734914353.asia-southeast1.run.app
  jwt_audience: https://vision-codef-gateway-772734914353.asia-southeast1.run.app
  path_translation: APPEND_PATH_TO_ADDRESS
securityDefinitions:
  api_key:
    type: apiKey
    name: key
    in: query
security:
  - api_key: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': { description: Healthy }
  /v1/analyze-frame:
    options:
      operationId: analyzeFrameOptions
      security: []
      responses:
        '204': { description: CORS preflight }
    post:
      operationId: analyzeFrame
      responses:
        '200': { description: Frame assessment }
        '400': { description: Invalid frame or analysis failure }
        '429': { description: Rate limited }
  /v1/procedures:
    post:
      operationId: createProcedure
      responses:
        '201': { description: Golden run saved }
  /v1/procedures/{procedureId}:
    parameters:
      - { name: procedureId, in: path, required: true, type: string }
    get:
      operationId: getProcedure
      responses:
        '200': { description: Golden run }
        '404': { description: Not found }
  /v1/live-call:
    post:
      operationId: createLiveCall
      responses:
        '200': { description: WebRTC SDP answer }
